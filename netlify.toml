[build]
  publish = "public"
  functions = "functions"

[functions]
  node_bundler = "esbuild"
  # catalogue.json / sold.json / _catalogue-source.js are require()d, so esbuild bundles them; listed
  # explicitly as a safety net.
  included_files = ["functions/catalogue.json", "functions/sold.json", "functions/_shared.js", "functions/_catalogue-source.js"]

# Confirmation page shown after payment: no caching, no referrer (its URL carries the Checkout session id), inline script and style only
[[headers]]
  for = "/order-confirmed.html"
  [headers.values]
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
